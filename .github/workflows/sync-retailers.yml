name: Sync retailer catalogs

on:
  schedule:
    # Every Monday at 03:00 UTC — low-traffic hours, once a week per the
    # catalog plan (re-sync existing Shopify retailers, not onboard new ones).
    - cron: "0 3 * * 1"
  workflow_dispatch: {} # allows a manual "Run workflow" click for testing

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/sync-retailers.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
