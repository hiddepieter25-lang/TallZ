name: Sync retailer catalogs

on:
  schedule:
    # Mondays and Thursdays at 03:00 UTC. Twice a week rather than once for a
    # reason that has nothing to do with catalog freshness: this Supabase
    # project is on the free plan, which pauses after 7 days without activity.
    # A weekly job sits exactly on that boundary — and lost. Between 2026-08-03
    # and 2026-08-26 three scheduled runs in a row reached a sleeping database
    # and wrote nothing at all, with no rows in ingestion_jobs to show for it.
    # Two runs a week keeps the gap at 3-4 days, safely inside the window.
    - cron: "0 3 * * 1,4"
  workflow_dispatch: {} # allows a manual "Run workflow" click for testing

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/sync-retailers.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
