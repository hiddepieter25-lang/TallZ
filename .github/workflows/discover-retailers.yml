name: Discover new retailers

on:
  schedule:
    # Every Monday at 02:00 UTC — an hour before the weekly product sync,
    # so a retailer approved soon after this run can be picked up the same
    # week (approval itself is still a manual click in /admin/retailers).
    - cron: "0 2 * * 1"
  workflow_dispatch: {} # allows a manual "Run workflow" click for testing

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/discover-retailers.mjs
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
